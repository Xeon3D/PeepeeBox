# Build PeepeeBox for Windows, Linux, macOS and Android, and publish the three
# archives and the APK as one GitHub Release when the commit is a named one.
#
# The per-OS jobs deliberately mirror the three CMake (…) CI workflows, which are
# known to build this tree green -- same dependency lists, same configure flags.
# The differences are on purpose:
#
#   * preset `regular` (Release, DEV_BRANCH off) rather than the debug/dev presets
#     CI uses, because this is what people actually run;
#   * roms/ and nvr/ are staged alongside the binary so the download is runnable
#     as-is -- PeepeeBox needs exactly two ROM images, and a blank CMOS stops the
#     4DPS BIOS on a hard disk error, so both live in this repository;
#   * macOS builds arm64 with NEW_DYNAREC on, because the CI matrix excludes the
#     old dynarec on arm64;
#   * Android builds the same tree for arm64 (android/README.md), signed with the
#     release key from the repository's secrets: PEEPEEBOX_ANDROID_KEYSTORE (the
#     PKCS12 keystore, base64) and PEEPEEBOX_ANDROID_KEYSTORE_PASSWORD (alias
#     peepeebox).  Without them it is a debug build, so a fork still builds.  The
#     updater only fetches the three archives by name, so the APK beside them is
#     never mistaken for one.
#
# Only a commit carrying a v<x.y[.z]> tag is published.  To cut one, push the tag
# along with the branch:
#
#     git tag -a v1.1 -m "…" && git push origin main v1.1
#
# Every other push to main still builds all three platforms -- that is the point of
# running this on push, and a build that breaks should break here -- but it stops at
# the uploaded artifacts on the run page.  It used to publish a `build-<run number>`
# release as well, which meant the releases page filled with builds nobody had chosen
# to release and "Latest" pointed at whatever was pushed last.  Fourteen of those were
# deleted on 2026-09-05; the releases page is for named versions only.
#
# The tag is also where the release number in the About box comes from: the `version`
# job below reads it once and every build job is configured with it, so the number cannot
# drift from the tag it ships under -- it did once, and Release 1.6 called itself 1.5.

name: Release

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - cmake/**
      - roms/**
      - nvr/**
      - android/**
      - "**/CMakeLists.txt"
      - CMakePresets.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # Read the release number off the tag once, so all three builds and the published
  # release agree by construction.  A commit that carries no v<x.y> tag is not a named
  # release: it reports the tag it descends from with a "+", never that tag's own number.
  version:
    name: Release number
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pick
        id: pick
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD | grep -E '^v[0-9]' | sort -V | tail -1 || true)"
          nearest="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -n "$tag" ]; then
            release="${tag#v}"
          elif [ -n "$nearest" ]; then
            release="${nearest#v}+"
          else
            release=""
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag '$tag', release '$release'"

  windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Prepare MSYS2 environment
        uses: msys2/setup-msys2@v2
        with:
          release: true
          update: true
          msystem: UCRT64
          pacboy: >-
            ninja:p
            cmake:p
            gcc:p
            pkgconf:p
            freetype:p
            sdl3:p
            zlib:p
            libpng:p
            openal:p
            rtmidi:p
            libslirp:p
            fluidsynth:p
            libserialport:p
            qt5-static:p
            vulkan-headers:p
            llvm-openmp:p
            zstd:p

      - uses: actions/checkout@v7

      - name: Configure
        run: >-
          cmake -S . -B build --preset regular -D NEW_DYNAREC=off -D QT=on
          -D PEEPEEBOX_RELEASE=${{ needs.version.outputs.release }}

      - name: Build
        run: cmake --build build

      - name: Package
        run: cmake --install build

      - name: Stage
        run: |
          mkdir -p dist/PeepeeBox
          cp -r build/artifacts/* dist/PeepeeBox/
          cp -r roms dist/PeepeeBox/
          cp -r nvr dist/PeepeeBox/
          cp README.md dist/PeepeeBox/

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist/PeepeeBox -DestinationPath PeepeeBox-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: PeepeeBox-windows-x64
          path: PeepeeBox-windows-x64.zip

  linux:
    name: Linux (x86_64)
    needs: version
    runs-on: ubuntu-26.04
    steps:
      - name: Install dependencies
        run: >-
          sudo apt update && sudo apt install -y
          build-essential
          ninja-build
          libfreetype-dev
          libgles2-mesa-dev
          libsdl3-dev
          libpng-dev
          libc6-dev
          librtmidi-dev
          libopenal-dev
          libslirp-dev
          libfluidsynth-dev
          libvdeplug-dev
          libserialport-dev
          libzstd-dev
          zip
          qtbase5-dev
          qtbase5-private-dev
          qttools5-dev
          qttranslations5-l10n
          libevdev-dev
          libxkbcommon-x11-dev

      - uses: actions/checkout@v7

      - name: Configure
        run: >-
          cmake -S . -B build --preset regular
          -D NEW_DYNAREC=off -D QT=on -D USE_QT6=off
          -D PEEPEEBOX_RELEASE=${{ needs.version.outputs.release }}

      - name: Build
        run: cmake --build build

      - name: Package
        run: cmake --install build

      - name: Stage
        run: |
          mkdir -p dist/PeepeeBox
          cp -r build/artifacts/* dist/PeepeeBox/
          cp -r roms dist/PeepeeBox/
          cp -r nvr dist/PeepeeBox/
          cp README.md dist/PeepeeBox/
          cd dist && zip -r ../PeepeeBox-linux-x86_64.zip PeepeeBox

      - uses: actions/upload-artifact@v7
        with:
          name: PeepeeBox-linux-x86_64
          path: PeepeeBox-linux-x86_64.zip

  macos:
    name: macOS (arm64)
    needs: version
    runs-on: macos-14
    steps:
      - name: Install dependencies
        run: >-
          brew install
          sdl3
          rtmidi
          openal-soft
          fluidsynth
          libslirp
          vde
          libserialport
          vulkan-headers
          zstd
          qt@5

      - uses: actions/checkout@v7

      - name: Configure
        run: >-
          cmake -S . -B build --preset regular
          -D NEW_DYNAREC=on
          -D QT=on
          -D Qt5_ROOT=$(brew --prefix qt@5)
          -D Qt5LinguistTools_ROOT=$(brew --prefix qt@5)
          -D OpenAL_ROOT=$(brew --prefix openal-soft)
          -D LIBSERIALPORT_ROOT=$(brew --prefix libserialport)
          -D PEEPEEBOX_RELEASE=${{ needs.version.outputs.release }}

      - name: Build
        run: cmake --build build

      - name: Package
        run: cmake --install build

      - name: Stage
        run: |
          mkdir -p dist/PeepeeBox
          cp -R build/artifacts/* dist/PeepeeBox/
          cp -R roms dist/PeepeeBox/
          cp -R nvr dist/PeepeeBox/
          cp README.md dist/PeepeeBox/
          # -y so the .app bundle's symlinks survive the archive
          cd dist && zip -ry ../PeepeeBox-macos-arm64.zip PeepeeBox

      - uses: actions/upload-artifact@v7
        with:
          name: PeepeeBox-macos-arm64
          path: PeepeeBox-macos-arm64.zip

  android:
    name: Android (arm64)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # android/scripts/env.sh: the runner's own SDK and JDK, the rest under ~/mpb-android.
      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y ninja-build
          echo "MPB_ANDROID=$HOME/mpb-android"   >> "$GITHUB_ENV"
          echo "MPB_ANDROID_SDK=$ANDROID_HOME"    >> "$GITHUB_ENV"
          echo "MPB_JAVA_HOME=$JAVA_HOME"         >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      - name: Cache the libraries
        id: deps
        uses: actions/cache@v6
        with:
          path: ~/mpb-android/deps
          key: android-deps-${{ hashFiles('android/scripts/build-deps.sh') }}

      - name: Libraries
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash android/scripts/build-deps.sh

      # Release-signed when the repository has the key; otherwise a debug build, so a
      # fork still builds.
      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.PEEPEEBOX_ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.PEEPEEBOX_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p "$MPB_ANDROID"
          echo "$KEYSTORE" | base64 -d > "$MPB_ANDROID/ppbox-release.keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=peepeebox\nkeyPassword=%s\n' \
              "$MPB_ANDROID/ppbox-release.keystore" "$PASSWORD" "$PASSWORD" > "$MPB_ANDROID/ppbox-release-signing.properties"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # The release number is the version job's, as for the desktop builds.
      - name: Build
        env:
          PEEPEEBOX_RELEASE: ${{ needs.version.outputs.release }}
        run: |
          set -euo pipefail
          if [ "${{ steps.key.outputs.signed }}" = true ]; then
            bash android/scripts/build.sh release
            cp android/out/PeepeeBox-*-android.apk PeepeeBox-android-arm64.apk
          else
            bash android/scripts/build.sh
            cp android/out/PeepeeBox-debug.apk PeepeeBox-android-arm64.apk
          fi

      - name: Forget the key
        if: always()
        run: rm -f "$MPB_ANDROID/ppbox-release.keystore" "$MPB_ANDROID/ppbox-release-signing.properties"

      - uses: actions/upload-artifact@v7
        with:
          name: PeepeeBox-android-arm64
          path: PeepeeBox-android-arm64.apk

  release:
    name: Publish release
    needs: [version, windows, linux, macos, android]
    # Named versions only.  An untagged push has already done the useful part by
    # building; its binaries are on the run page as artifacts.
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      # gh resolves the repository from the checkout, and the tag has to exist here
      # for the release to attach to it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      # Installed copies of 1.11 and earlier unpack an update with a reader that
      # fails ("inflate failed (-5)") on a deflate stream that happens to align
      # badly with its 64 KiB buffers -- 1.11's own Windows archive did, and so
      # did five of the nine archives from 1.10 to 1.11.  Those copies are the
      # ones that will fetch this release, so each archive is replayed through
      # that reader and any entry that would trip it is re-deflated until none
      # does.  Nothing else about the archive changes.
      - name: Make the archives installable by 1.11 and earlier
        run: python3 tools/updatezip.py --fix assets/*.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The job only runs for a tagged commit, so this is always a named release.
          # The number came from the version job, which is what the binaries were
          # built with, so the release and the About box cannot disagree.
          tag="${{ needs.version.outputs.tag }}"
          title="Release ${tag#v}"
          headline="PeepeeBox $title — \`${GITHUB_SHA::7}\`"

          # A release can carry its own notes: docs/release-notes/<tag>.md, verbatim
          # and nothing else.  What a release says it changed is a thing to write by
          # hand next to the change, not something a build script can work out -- and
          # the boilerplate below says the same thing every time, which is worth
          # having only when there is nothing better to say.
          if [ -f "docs/release-notes/${tag}.md" ]; then
            cp "docs/release-notes/${tag}.md" notes.md
          else
            {
              echo "$headline"
              echo
              echo "Each archive contains the emulator, the two ROM images and the settled"
              echo "CMOS it needs, and the README. Drop your \`HardDisk.img\` into that same"
              echo "folder, beside \`PeepeeBox.exe\`, and run it."
              echo
              echo "| Platform | Notes |"
              echo "|---|---|"
              echo "| Windows x64 | Qt 5, statically linked |"
              echo "| Linux x86_64 | Qt 5; needs the usual runtime libraries |"
              echo "| macOS arm64 | Qt 5, new dynarec; unsigned, so Gatekeeper will object |"
              echo "| Android arm64 | the APK; Android 9 or later |"
            } > notes.md
          fi
          gh release create "$tag" assets/*.zip assets/*.apk \
              --title "$title" \
              --notes-file notes.md \
              --latest
