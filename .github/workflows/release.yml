# Build PeepeeBox for Windows, Linux and macOS and publish the three artifacts as
# a GitHub Release, one per build.
#
# The per-OS jobs deliberately mirror the three CMake (…) CI workflows, which are
# known to build this tree green -- same dependency lists, same configure flags.
# The differences are on purpose:
#
#   * preset `regular` (Release, DEV_BRANCH off) rather than the debug/dev presets
#     CI uses, because this is what people actually run;
#   * roms/ is staged alongside the binary so the download is runnable as-is --
#     PeepeeBox needs exactly two ROM images and they live in this repository;
#   * macOS builds arm64 with NEW_DYNAREC on, because the CI matrix excludes the
#     old dynarec on arm64.
#
# Releases are tagged build-<run number>, so re-running never collides -- unless the
# commit carries a v<x.y> tag, in which case that tag names the release instead and
# it is titled "Release <x.y>".  To cut one, push the tag along with the branch:
#
#     git tag -a v1.1 -m "…" && git push origin main v1.1
#
# That tag is also where the release number in the About box comes from: the `version`
# job below reads it once and every build job is configured with it, so the number cannot
# drift from the tag it ships under -- it did once, and Release 1.6 called itself 1.5.

name: Release

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - cmake/**
      - roms/**
      - "**/CMakeLists.txt"
      - CMakePresets.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # Read the release number off the tag once, so all three builds and the published
  # release agree by construction.  A commit that carries no v<x.y> tag is not a named
  # release: it reports the tag it descends from with a "+", never that tag's own number.
  version:
    name: Release number
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick
        id: pick
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD | grep -E '^v[0-9]' | sort -V | tail -1 || true)"
          nearest="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [ -n "$tag" ]; then
            release="${tag#v}"
          elif [ -n "$nearest" ]; then
            release="${nearest#v}+"
          else
            release=""
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag '$tag', release '$release'"

  windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Prepare MSYS2 environment
        uses: msys2/setup-msys2@v2
        with:
          release: true
          update: true
          msystem: UCRT64
          pacboy: >-
            ninja:p
            cmake:p
            gcc:p
            pkgconf:p
            freetype:p
            sdl3:p
            zlib:p
            libpng:p
            openal:p
            rtmidi:p
            libslirp:p
            fluidsynth:p
            libserialport:p
            qt5-static:p
            vulkan-headers:p
            llvm-openmp:p
            zstd:p

      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build --preset regular -D NEW_DYNAREC=off -D QT=on
          -D PEEPEEBOX_RELEASE=${{ needs.version.outputs.release }}

      - name: Build
        run: cmake --build build

      - name: Package
        run: cmake --install build

      - name: Stage
        run: |
          mkdir -p dist/PeepeeBox
          cp -r build/artifacts/* dist/PeepeeBox/
          cp -r roms dist/PeepeeBox/
          cp README.md dist/PeepeeBox/

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist/PeepeeBox -DestinationPath PeepeeBox-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PeepeeBox-windows-x64
          path: PeepeeBox-windows-x64.zip

  linux:
    name: Linux (x86_64)
    needs: version
    runs-on: ubuntu-26.04
    steps:
      - name: Install dependencies
        run: >-
          sudo apt update && sudo apt install -y
          build-essential
          ninja-build
          libfreetype-dev
          libgles2-mesa-dev
          libsdl3-dev
          libpng-dev
          libc6-dev
          librtmidi-dev
          libopenal-dev
          libslirp-dev
          libfluidsynth-dev
          libvdeplug-dev
          libserialport-dev
          libzstd-dev
          zip
          qtbase5-dev
          qtbase5-private-dev
          qttools5-dev
          qttranslations5-l10n
          libevdev-dev
          libxkbcommon-x11-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build --preset regular
          -D NEW_DYNAREC=off -D QT=on -D USE_QT6=off
          -D PEEPEEBOX_RELEASE=${{ needs.version.outputs.release }}

      - name: Build
        run: cmake --build build

      - name: Package
        run: cmake --install build

      - name: Stage
        run: |
          mkdir -p dist/PeepeeBox
          cp -r build/artifacts/* dist/PeepeeBox/
          cp -r roms dist/PeepeeBox/
          cp README.md dist/PeepeeBox/
          cd dist && zip -r ../PeepeeBox-linux-x86_64.zip PeepeeBox

      - uses: actions/upload-artifact@v4
        with:
          name: PeepeeBox-linux-x86_64
          path: PeepeeBox-linux-x86_64.zip

  macos:
    name: macOS (arm64)
    needs: version
    runs-on: macos-14
    steps:
      - name: Install dependencies
        run: >-
          brew install
          sdl3
          rtmidi
          openal-soft
          fluidsynth
          libslirp
          vde
          libserialport
          vulkan-headers
          zstd
          qt@5

      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build --preset regular
          -D NEW_DYNAREC=on
          -D QT=on
          -D Qt5_ROOT=$(brew --prefix qt@5)
          -D Qt5LinguistTools_ROOT=$(brew --prefix qt@5)
          -D OpenAL_ROOT=$(brew --prefix openal-soft)
          -D LIBSERIALPORT_ROOT=$(brew --prefix libserialport)
          -D PEEPEEBOX_RELEASE=${{ needs.version.outputs.release }}

      - name: Build
        run: cmake --build build

      - name: Package
        run: cmake --install build

      - name: Stage
        run: |
          mkdir -p dist/PeepeeBox
          cp -R build/artifacts/* dist/PeepeeBox/
          cp -R roms dist/PeepeeBox/
          cp README.md dist/PeepeeBox/
          # -y so the .app bundle's symlinks survive the archive
          cd dist && zip -ry ../PeepeeBox-macos-arm64.zip PeepeeBox

      - uses: actions/upload-artifact@v4
        with:
          name: PeepeeBox-macos-arm64
          path: PeepeeBox-macos-arm64.zip

  release:
    name: Publish release
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      # Full history and tags, so the step below can see whether this commit was
      # tagged as a named release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"

          # A commit carrying a v<x.y> tag is a named release; anything else is
          # just the next automatic build.  Push the tag together with the branch
          # (git push origin main v1.1) and this picks it up.  The number itself came
          # from the version job, which is what the binaries were built with.
          version="${{ needs.version.outputs.tag }}"
          if [ -n "$version" ]; then
            tag="$version"
            title="Release ${version#v}"
            headline="PeepeeBox $title — \`${GITHUB_SHA::7}\`"
          else
            tag="build-${{ github.run_number }}"
            title="PeepeeBox $tag"
            headline="Automatic build of \`${GITHUB_SHA::7}\` — $subject"
          fi

          {
            echo "$headline"
            echo
            echo "Each archive contains the emulator, the two ROM images it needs, and"
            echo "the README. Drop your \`HardDisk.img\` in beside the executable and run it."
            echo
            echo "| Platform | Notes |"
            echo "|---|---|"
            echo "| Windows x64 | Qt 5, statically linked |"
            echo "| Linux x86_64 | Qt 5; needs the usual runtime libraries |"
            echo "| macOS arm64 | Qt 5, new dynarec; unsigned, so Gatekeeper will object |"
          } > notes.md
          gh release create "$tag" assets/*.zip \
              --title "$title" \
              --notes-file notes.md \
              --latest
